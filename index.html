<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8"/>
  <!-- maximum-scale ist bewusst raus: Zoom darf der Nutzer nicht verboten werden. -->
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="color-scheme" content="dark"/>
  <meta name="theme-color" content="#121114"/>
  <title>BandSync</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Archivo = Display, IBM Plex Sans = Text, IBM Plex Mono = Zahlen/Akkorde -->
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="root"><div style="display:flex;height:100vh;align-items:center;justify-content:center"><div class="spin"></div></div></div>

<!-- ═══ Bibliotheken (CDN) ═══ -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.28.4/babel.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>

<!-- ═══ Tailwind CSS (Play-CDN, kein Build-Schritt noetig) ═══ -->
<script src="https://cdn.tailwindcss.com"></script>
<script src="js/core/tailwind-config.js"></script>

<!--
  ═══════════════════════════════════════════════════════════════════
   APP-DATEIEN — die Reihenfolge ist wichtig!
   Alle Dateien teilen sich denselben globalen Scope (kein Bundler).
   Beim Hinzufügen einer neuen Datei: hier unten eintragen.
  ═══════════════════════════════════════════════════════════════════
-->

<!-- 1. Kern / Grundlagen -->
<script type="text/babel" src="js/core/react-hooks.js"></script>
<script type="text/babel" src="js/core/firebase-config.js"></script>
<script type="text/babel" src="js/core/theme.js"></script>
<script type="text/babel" src="js/core/constants.js"></script>
<script type="text/babel" src="js/core/helpers.js"></script>
<script type="text/babel" src="js/core/chords.js"></script>
<script type="text/babel" src="js/core/firebase.js"></script>

<!-- 2. Wiederverwendbare Komponenten -->
<script type="text/babel" src="js/components/icons.js"></script>
<script type="text/babel" src="js/components/ui.js"></script>
<script type="text/babel" src="js/components/chordchart.js"></script>
<script type="text/babel" src="js/components/sheet.js"></script>
<script type="text/babel" src="js/components/comments.js"></script>
<script type="text/babel" src="js/components/attendance.js"></script>
<script type="text/babel" src="js/components/hero.js"></script>
<script type="text/babel" src="js/components/nav.js"></script>

<!-- 3. Seiten -->
<script type="text/babel" src="js/pages/auth.js"></script>
<script type="text/babel" src="js/pages/dashboard.js"></script>
<script type="text/babel" src="js/pages/schedule.js"></script>
<script type="text/babel" src="js/pages/songs.js"></script>
<script type="text/babel" src="js/pages/songdetail.js"></script>
<script type="text/babel" src="js/pages/performance.js"></script>
<script type="text/babel" src="js/pages/profile.js"></script>

<!-- 4. App-Einstieg (muss zuletzt kommen) -->
<script type="text/babel" src="js/app.js"></script>
</body>
</html>
