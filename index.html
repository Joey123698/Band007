<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500&family=Playfair+Display:ital,wght@0,800;1,700&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    :root{
      --bg:#06060F;--surf:#0C0C1E;--surf2:#111128;--surf3:#16163A;
      --border:#1C1C40;--border2:#242455;
      --text:#E2E2F5;--t2:#7070A8;--t3:#38386A;
      --purple:#7C3AED;--gold:#F59E0B;--green:#10B981;
      --red:#EF4444;--cyan:#06B6D4;--pink:#EC4899;
      --glow:rgba(124,58,237,.18);
      --r:10px;--r-sm:6px;--r-lg:14px;--r-pill:999px;
    }
    html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;}
    #root{height:100%;}
    button,input,select,textarea{font-family:inherit;}
    a{color:var(--cyan);}
    ::-webkit-scrollbar{width:3px;height:3px;}
    ::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}
    .spin{width:22px;height:22px;border:2px solid var(--border2);border-top-color:var(--purple);border-radius:50%;animation:spin .7s linear infinite;display:inline-block;}
    @keyframes spin{to{transform:rotate(360deg)}}
    .fade{animation:fadeUp .2s ease;}
    @keyframes fadeUp{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
    input[type=range]{-webkit-appearance:none;width:100%;height:4px;border-radius:2px;background:var(--border2);outline:none;}
    input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--purple);cursor:pointer;}
  </style>
</head>

const uid     = () => Math.random().toString(36).slice(2,9);
const toKey   = d => { const dt=new Date(d); return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`; };
const nowKey  = () => toKey(new Date());

const hlbl    = h => `${String(h).padStart(2,'0')}:00`;
const dfmt    = d => new Date(d).toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit'});

const extractYTId = url => { const m=(url||'').match(/(?:v=|youtu\.be\/|embed\/)([a-zA-Z0-9_-]{11})/); return m?m[1]:null; };

const getMondayOf = (offset=0) => {
  const now=new Date(), day=now.getDay()||7, m=new Date(now);
  m.setDate(now.getDate()-day+1+offset*7); m.setHours(0,0,0,0); return m;
};
const getWeekDays = (offset=0) => {
  const m=getMondayOf(offset);
  return Array.from({length:7},(_,i)=>{ const d=new Date(m); d.setDate(m.getDate()+i); return d; });
};

function Card({children,style={},glow}){
  return <div style={{background:'var(--surf)',border:`1px solid ${glow?'var(--border2)':'var(--border)'}`,borderRadius:'var(--r)',padding:16,boxShadow:glow?'0 0 24px var(--glow)':'none',...style}}>{children}</div>;
}
function Btn({onClick,children,color,style={},disabled,size='md'}){
  const p={sm:'4px 10px',md:'7px 14px',lg:'11px 22px'}[size], f={sm:11,md:13,lg:14}[size];
  return <button onClick={onClick} disabled={disabled} style={{padding:p,borderRadius:'var(--r-sm)',background:color||'var(--surf2)',color:disabled?'var(--t3)':'var(--text)',fontSize:f,fontWeight:600,border:'1px solid var(--border2)',opacity:disabled?.45:1,cursor:disabled?'default':'pointer',transition:'all .12s',...style}}>{children}</button>;
}
function PillBtn({active,onClick,children,color}){
  return <button onClick={onClick} style={{padding:'5px 11px',borderRadius:'var(--r-pill)',border:'none',cursor:'pointer',fontSize:11,fontWeight:700,background:active?(color||'var(--purple)'):'var(--surf2)',color:active?'#fff':'var(--t2)',transition:'all .12s',whiteSpace:'nowrap'}}>{children}</button>;
}
function Badge({label,color,bg}){
  return <span style={{fontSize:10,fontWeight:700,padding:'2px 8px',borderRadius:'var(--r-pill)',background:bg||'var(--surf3)',color:color||'var(--t2)',letterSpacing:.3,whiteSpace:'nowrap'}}>{label}</span>;
}
function Inp({value,onChange,placeholder,type='text',style={},onKeyDown}){

}
function Txta({value,onChange,placeholder,rows=3,style={}}){

function Sel({value,onChange,options,style={}}){

// ════════════════════════════════════════════════════
//  COMMENTS (reusable for sessions + songs)
// ════════════════════════════════════════════════════
function CommentsThread({collection,docId,user,profile,members}){
  const[comments,setComments]=useState([]);
  const[text,setText]=useState('');
  const[loading,setLoading]=useState(false);
  useEffect(()=>{
    // Single where clause — no composite index needed
    const u=db.collection(collection).where('docId','==',docId).onSnapshot(s=>{
      const c=s.docs.map(d=>({id:d.id,...d.data()}));
      c.sort((a,b)=>(a.createdAt?.seconds||0)-(b.createdAt?.seconds||0));
      setComments(c);
    });
    return u;
  },[docId]);
  const send=async()=>{
    if(!text.trim())return; setLoading(true);
    await db.collection(collection).add({docId,userId:user.uid,userName:profile.displayName,userBandRole:profile.role,avatar:profile.avatar||'🎵',text:text.trim(),createdAt:firebase.firestore.FieldValue.serverTimestamp()});
    setText(''); setLoading(false);
  };
  const del=async id=>db.collection(collection).doc(id).delete();
  return <div>
    {comments.map(c=><div key={c.id} style={{display:'flex',gap:8,marginBottom:8,alignItems:'flex-start'}}>
      <Av emoji={c.avatar} size={26}/>
      <div style={{flex:1}}>
        <div style={{display:'flex',gap:6,alignItems:'center',marginBottom:3,flexWrap:'wrap'}}>
          <span style={{fontSize:11,fontWeight:700}}>{c.userName}</span>
          <Badge label={c.userBandRole} color={ROLE_COLORS[c.userBandRole]} bg='var(--surf3)'/>
        </div>
        <div style={{fontSize:12,color:'var(--t2)',lineHeight:1.5,padding:'6px 10px',background:'var(--bg)',borderRadius:'var(--r-sm)',border:'1px solid var(--border)'}}>{c.text}</div>
      </div>
      {c.userId===user.uid&&<button onClick={()=>del(c.id)} style={{background:'none',border:'none',color:'var(--t3)',cursor:'pointer',fontSize:13,paddingTop:4}}>×</button>}
    </div>)}
    <div style={{display:'flex',gap:7,marginTop:6}}>
      <Inp value={text} onChange={e=>setText(e.target.value)} onKeyDown={e=>e.key==='Enter'&&!e.shiftKey&&(e.preventDefault(),send())} placeholder="Kommentar..." style={{flex:1,fontSize:12}}/>
      <Btn onClick={send} disabled={loading||!text.trim()} style={{background:'var(--purple)',color:'#fff',border:'none',padding:'0 14px',flexShrink:0}}>→</Btn>
    </div>
  </div>;
}

// ════════════════════════════════════════════════════
//  ATTENDANCE
// ════════════════════════════════════════════════════
function AttendanceSection({session,user,profile}){
  const[reason,setReason]=useState('');
  const[showDecline,setShowDecline]=useState(false);
  const att=session.attendance||{};
  const mine=att[user.uid];
  const confirmed=Object.values(att).filter(v=>v.status==='confirmed');
  const declined=Object.values(att).filter(v=>v.status==='declined');
  const set=async(status)=>{
    await db.collection('sessions').doc(session.id).update({[`attendance.${user.uid}`]:{status,reason:status==='declined'?reason:'',name:profile.displayName,role:profile.role,avatar:profile.avatar||'🎵',updatedAt:new Date().toISOString()}});
    setShowDecline(false); setReason('');
  };
  const clear=async()=>{ const u={...att}; delete u[user.uid]; await db.collection('sessions').doc(session.id).update({attendance:u}); };
  return <div style={{borderTop:'1px solid var(--border)',paddingTop:12,marginTop:12}}>
    <div style={{fontSize:10,fontWeight:700,color:'var(--t2)',letterSpacing:.5,textTransform:'uppercase',marginBottom:10}}>Meine Teilnahme</div>
    {mine ? <div style={{display:'flex',alignItems:'center',gap:10,padding:'8px 12px',borderRadius:'var(--r-sm)',background:mine.status==='confirmed'?'rgba(16,185,129,.1)':'rgba(239,68,68,.1)',border:`1px solid ${mine.status==='confirmed'?'rgba(16,185,129,.3)':'rgba(239,68,68,.3)'}`,marginBottom:10}}>
      <span>{mine.status==='confirmed'?'✅':'❌'}</span>
      <span style={{fontSize:12,color:mine.status==='confirmed'?'var(--green)':'var(--red)',fontWeight:600,flex:1}}>{mine.status==='confirmed'?'Ich komme':'Abgesagt'}{mine.reason&&` — ${mine.reason}`}</span>
      <button onClick={clear} style={{background:'none',border:'none',color:'var(--t3)',cursor:'pointer',fontSize:11}}>Ändern</button>
    </div> : showDecline ? <div style={{marginBottom:10,display:'flex',flexDirection:'column',gap:7}}>
      <Inp value={reason} onChange={e=>setReason(e.target.value)} placeholder="Grund (optional)..." style={{fontSize:12}}/>
      <div style={{display:'flex',gap:6}}>
        <Btn onClick={()=>set('declined')} style={{flex:1,background:'rgba(239,68,68,.15)',color:'var(--red)',border:'1px solid rgba(239,68,68,.3)'}}>Absagen bestätigen</Btn>
        <Btn onClick={()=>setShowDecline(false)} size="sm">Zurück</Btn>
      </div>
    </div> : <div style={{display:'flex',gap:7,marginBottom:10}}>
      <button onClick={()=>set('confirmed')} style={{flex:1,padding:'9px',borderRadius:'var(--r-sm)',border:'1px solid rgba(16,185,129,.4)',background:'rgba(16,185,129,.1)',color:'var(--green)',fontWeight:700,fontSize:13,cursor:'pointer'}}>✓ Ich komme</button>
      <button onClick={()=>setShowDecline(true)} style={{flex:1,padding:'9px',borderRadius:'var(--r-sm)',border:'1px solid rgba(239,68,68,.4)',background:'rgba(239,68,68,.1)',color:'var(--red)',fontWeight:700,fontSize:13,cursor:'pointer'}}>✗ Absagen</button>
    </div>}
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
      {[{arr:confirmed,label:'ZUSAGEN',color:'var(--green)',bg:'rgba(16,185,129,.07)',bc:'rgba(16,185,129,.2)'},{arr:declined,label:'ABSAGEN',color:'var(--red)',bg:'rgba(239,68,68,.07)',bc:'rgba(239,68,68,.2)'}].map(({arr,label,color,bg,bc})=>
        <div key={label} style={{padding:'8px 10px',background:bg,borderRadius:'var(--r-sm)',border:`1px solid ${bc}`}}>
          <div style={{fontSize:10,color,fontWeight:700,marginBottom:5}}>{label} ({arr.length})</div>
          {arr.length===0?<div style={{fontSize:10,color:'var(--t3)'}}>Noch niemand</div>:arr.map((m,i)=><div key={i} style={{display:'flex',gap:4,alignItems:'center',marginBottom:2}}>
            <span style={{fontSize:11}}>{m.avatar}</span><span style={{fontSize:11,color:'var(--text)'}}>{m.name}</span>
            {m.reason&&<span style={{fontSize:9,color:'var(--t3)'}}>— {m.reason}</span>}
          </div>)}
        </div>
      )}
    </div>
  </div>;
}

function MiniCalendar({sessions}){
  const today=new Date(), tk=toKey(today);
  const days=getWeekDays(0);
  const probeTagen=new Set((sessions||[]).map(s=>s.date));
  const monthLabel=today.toLocaleDateString('de-DE',{month:'long',year:'numeric'});
  return <div style={{padding:'12px 18px',background:'var(--surf)',borderBottom:'1px solid var(--border)'}}>
    <div style={{fontSize:9,color:'var(--t3)',fontWeight:700,letterSpacing:.5,textTransform:'uppercase',marginBottom:8}}>{monthLabel}</div>
    <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:4}}>
      {days.map((d,i)=>{
        const dk=toKey(d), isToday=dk===tk, hasProbe=probeTagen.has(dk);
        return <div key={i} style={{textAlign:'center'}}>
          <div style={{fontSize:8,color:'var(--t3)',marginBottom:3}}>{DAYS_DE[i]}</div>
          <div style={{width:28,height:28,margin:'0 auto',borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center',fontSize:12,fontWeight:isToday?800:hasProbe?700:400,background:isToday?'var(--purple)':hasProbe?'rgba(124,58,237,.22)':'transparent',color:isToday?'#fff':hasProbe?'var(--purple)':'var(--t2)',border:hasProbe&&!isToday?'1px solid rgba(124,58,237,.4)':'1px solid transparent'}}>
            {d.getDate()}
          </div>
          {hasProbe&&!isToday&&<div style={{width:4,height:4,borderRadius:'50%',background:'var(--purple)',margin:'2px auto 0'}}/>}
        </div>;
      })}
    </div>
  </div>;
}

// ════════════════════════════════════════════════════
//  AUTH
// ════════════════════════════════════════════════════
function AuthScreen(){
  const[mode,setMode]=useState('login');
  const[email,setEmail]=useState('');
  const[pass,setPass]=useState('');
  const[name,setName]=useState('');
  const[role,setRole]=useState(BAND_ROLES[0]);
  const[loading,setLoading]=useState(false);
  const[err,setErr]=useState('');
  const submit=async()=>{
    if(!hasConfig()){setErr('Firebase-Konfiguration fehlt.');return;}
    setLoading(true);setErr('');
    try{
      if(mode==='login'){await auth.signInWithEmailAndPassword(email,pass);}
      else{
        if(!name.trim()){setErr('Name eingeben.');setLoading(false);return;}
        if(pass.length<6){setErr('Passwort muss mindestens 6 Zeichen haben.');setLoading(false);return;}
        const c=await auth.createUserWithEmailAndPassword(email,pass);
        await db.collection('users').doc(c.user.uid).set({displayName:name.trim(),email,role,avatar:AVATARS[Math.floor(Math.random()*AVATARS.length)],bio:'',skills:[],favoriteSongs:[],playableSongs:[],createdAt:firebase.firestore.FieldValue.serverTimestamp()});
      }
    }catch(e){setErr(e.code==='auth/wrong-password'?'Falsches Passwort.':e.code==='auth/user-not-found'?'E-Mail nicht gefunden.':e.code==='auth/email-already-in-use'?'E-Mail bereits registriert — bitte anmelden.':e.message||'Fehler.');}
    setLoading(false);
  };
  return <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',padding:20,background:'radial-gradient(ellipse at 30% 20%,rgba(124,58,237,.14) 0%,transparent 60%)'}}>
    <div style={{width:'100%',maxWidth:370}}>
      <div style={{textAlign:'center',marginBottom:26}}>
        <div style={{fontSize:42,marginBottom:6}}>🎸</div>
        <div style={{fontSize:26,fontWeight:900,letterSpacing:-1,background:'linear-gradient(135deg,#8B5CF6,#EC4899)',WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent'}}>BandSync</div>
        <div style={{fontSize:11,color:'var(--t2)',marginTop:3}}>Interne Plattform für deine Band</div>
      </div>
      <Card glow>
        <div style={{display:'flex',gap:3,marginBottom:16,background:'var(--bg)',borderRadius:'var(--r-sm)',padding:3}}>
          {['login','register'].map(m=><button key={m} onClick={()=>{setMode(m);setErr('');}} style={{flex:1,padding:'8px',borderRadius:'var(--r-sm)',border:'none',cursor:'pointer',fontSize:12,fontWeight:600,background:mode===m?'var(--surf2)':'transparent',color:mode===m?'var(--text)':'var(--t2)'}}>{m==='login'?'Anmelden':'Registrieren'}</button>)}
        </div>
        <div style={{display:'flex',flexDirection:'column',gap:10}}>
          {mode==='register'&&<Fld label="Name"><Inp value={name} onChange={e=>setName(e.target.value)} placeholder="Dein Name..."/></Fld>}
          {mode==='register'&&<Fld label="Rolle"><Sel value={role} onChange={e=>setRole(e.target.value)} options={BAND_ROLES}/></Fld>}
          <Fld label="E-Mail"><Inp type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="name@band.de"/></Fld>
          <Fld label="Passwort (min. 6 Zeichen)"><Inp type="password" value={pass} onChange={e=>setPass(e.target.value)} placeholder="••••••••" onKeyDown={e=>e.key==='Enter'&&submit()}/></Fld>
        </div>
        {err&&<div style={{marginTop:10,padding:'8px 11px',background:'rgba(239,68,68,.1)',border:'1px solid rgba(239,68,68,.3)',borderRadius:'var(--r-sm)',fontSize:12,color:'var(--red)'}}>{err}</div>}
        <button onClick={submit} disabled={loading} style={{width:'100%',marginTop:12,padding:'11px',borderRadius:'var(--r)',border:'none',background:'linear-gradient(135deg,var(--purple),#5B21B6)',color:'#fff',fontWeight:700,fontSize:14,cursor:loading?'default':'pointer',opacity:loading?.7:1}}>
          {loading?'...':(mode==='login'?'Anmelden':'Konto erstellen')}
        </button>
      </Card>
    </div>
  </div>;
}

// ════════════════════════════════════════════════════
//  SCHEDULE PAGE
// ════════════════════════════════════════════════════
function SchedulePage({user,profile,allSessions,allSongs,members}){
  const[weekOff,setWeekOff]=useState(0);
  const[myAvail,setMyAvail]=useState({});
  const[allAvail,setAllAvail]=useState({});
  const[locations,setLocations]=useState([]);
  const[view,setView]=useState('avail');
  const[sf,setSF]=useState({title:'',date:'',time:'',location:'',leadId:'',notes:'',setlist:[]});
  const[newLoc,setNewLoc]=useState('');
  const[editId,setEditId]=useState(null);
  const[showCommentsId,setShowCommentsId]=useState(null);
  const dragging=useRef(false),dragMode=useRef('set');

  const weekDays=useMemo(()=>getWeekDays(weekOff),[weekOff]);

  useEffect(()=>{
    const u1=db.collection('availability').doc(user.uid).onSnapshot(d=>{if(d.exists)setMyAvail(d.data().slots||{});});
    const u2=db.collection('availability').onSnapshot(s=>{const a={};s.docs.forEach(d=>{a[d.id]=d.data().slots||{};});setAllAvail(a);});
    const u3=db.collection('locations').onSnapshot(s=>setLocations(s.docs.map(d=>({id:d.id,...d.data()}))));
    return()=>{u1();u2();u3();};
  },[]);

  const saveAvail=async slots=>{await db.collection('availability').doc(user.uid).set({slots,updatedAt:firebase.firestore.FieldValue.serverTimestamp()});};
  const toggle=(d,h)=>{const k=slotKey(d,h);const n={...myAvail,[k]:!myAvail[k]};if(!n[k])delete n[k];setMyAvail(n);saveAvail(n);};
  const handleMD=(d,h)=>{dragging.current=true;dragMode.current=myAvail[slotKey(d,h)]?'unset':'set';toggle(d,h);};
  const handleME=(d,h)=>{if(!dragging.current)return;const k=slotKey(d,h);const n={...myAvail,[k]:dragMode.current==='set'};if(dragMode.current!=='set')delete n[k];setMyAvail(n);saveAvail(n);};
  useEffect(()=>{const up=()=>{dragging.current=false;};window.addEventListener('mouseup',up);window.addEventListener('touchend',up);return()=>{window.removeEventListener('mouseup',up);window.removeEventListener('touchend',up);};},[]);

  // Count availability per slot
  const counts={};
  DAYS_DE.forEach((_,d)=>HOURS.forEach(h=>{ const k=slotKey(d,h);counts[k]=0;Object.values(allAvail).forEach(a=>{if(a&&a[k])counts[k]++;});}));
  const maxCount=Math.max(...Object.values(counts).filter(Boolean),1);
  const bestSlots=Object.entries(counts).filter(([,c])=>c>0).sort((a,b)=>b[1]-a[1]);
  const best=bestSlots[0]||null;

  const addLoc=async()=>{if(!newLoc.trim())return;await db.collection('locations').add({name:newLoc.trim(),createdAt:firebase.firestore.FieldValue.serverTimestamp()});setNewLoc('');};
  const createSess=async()=>{
    if(!sf.date)return;
    const lead=members.find(m=>m.id===sf.leadId);
    await db.collection('sessions').add({...sf,leadName:lead?.displayName||'',attendance:{},status:'upcoming',createdAt:firebase.firestore.FieldValue.serverTimestamp()});
    setSF({title:'',date:'',time:'',location:'',leadId:'',notes:'',setlist:[]});setView('proben');
  };
  const updateSess=async(id,data)=>{await db.collection('sessions').doc(id).update(data);setEditId(null);};
  const deleteSess=async id=>{if(window.confirm('Probe löschen?'))await db.collection('sessions').doc(id).delete();};
  const toggleSL=s=>{const ex=sf.setlist.find(x=>x.songId===s.id);setSF(f=>({...f,setlist:ex?f.setlist.filter(x=>x.songId!==s.id):[...f.setlist,{songId:s.id,title:s.title,artist:s.artist}]}));};

  // Sessions: show max 5 nearest past + 5 upcoming
  const today=nowKey();
  const upcoming5=allSessions.filter(s=>s.date>=today&&s.status!=='cancelled').sort((a,b)=>a.date.localeCompare(b.date)).slice(0,5);
  const past5=allSessions.filter(s=>s.date<today||s.status==='completed').sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);
  const practiceSongs=allSongs.filter(s=>['practicing','ready'].includes(s.status));

  const bestLabel=best?(()=>{const[d,h]=best[0].split('_');return `${DAYS_DE[+d]}, ${hlbl(+h)} — ${best[1]}/${members.length} verfügbar`;})():null;

  // Week label
  const weekLabel=weekOff===0?'Diese Woche':weekOff===-1?'Letzte Woche':weekOff===1?'Nächste Woche':(weekOff<0?`Vor ${-weekOff} Wochen`:`In ${weekOff} Wochen`);

  return <div style={{padding:'16px 16px 90px'}}>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
      <div style={{fontSize:17,fontWeight:800}}>📅 Probeplan</div>
      <div style={{display:'flex',gap:5}}>
        <PillBtn active={view==='avail'} onClick={()=>setView('avail')}>Verfügbarkeit</PillBtn>
        <PillBtn active={view==='proben'} onClick={()=>setView('proben')}>Proben</PillBtn>
        <PillBtn active={view==='create'} onClick={()=>setView('create')}>+ Neu</PillBtn>
      </div>
    </div>

    {view==='avail'&&<>
      {bestLabel&&<Card glow style={{marginBottom:12,background:'rgba(124,58,237,.07)'}}>
        <div style={{fontSize:10,fontWeight:700,color:'var(--purple)',letterSpacing:.5,marginBottom:2}}>⚡ OPTIMALE PROBEZEIT</div>
        <div style={{fontSize:14,fontWeight:800}}>{bestLabel}</div>
      </Card>}
      <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:10}}>
        <button onClick={()=>setWeekOff(w=>w-1)} style={{padding:'6px 12px',borderRadius:'var(--r-sm)',border:'1px solid var(--border2)',background:'var(--surf)',color:'var(--text)',cursor:'pointer'}}>‹</button>
        <div style={{flex:1,textAlign:'center'}}>
          <div style={{fontSize:12,fontWeight:700}}>{weekLabel}</div>
          <div style={{fontSize:10,color:'var(--t3)'}}>{weekDays[0].toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'})} – {weekDays[6].toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'})}</div>
        </div>
        <button onClick={()=>setWeekOff(w=>w+1)} style={{padding:'6px 12px',borderRadius:'var(--r-sm)',border:'1px solid var(--border2)',background:'var(--surf)',color:'var(--text)',cursor:'pointer'}}>›</button>
      </div>
      <div style={{overflowX:'auto',userSelect:'none',marginBottom:16}}>
        <div style={{minWidth:480}}>
          <div style={{display:'grid',gridTemplateColumns:`44px repeat(7,1fr)`,gap:2,marginBottom:3}}>
            <div/>
            {weekDays.map((d,i)=>{
              const isT=toKey(d)===nowKey();
              return <div key={i} style={{textAlign:'center',padding:'2px 0'}}>
                <div style={{fontSize:9,fontWeight:700,color:isT?'var(--purple)':'var(--t2)'}}>{DAYS_DE[i]}</div>
                <div style={{fontSize:10,fontWeight:isT?800:400,color:isT?'var(--purple)':'var(--t3)'}}>{d.getDate()}.{String(d.getMonth()+1).padStart(2,'0')}</div>
              </div>;
            })}
          </div>
          {HOURS.map(h=><div key={h} style={{display:'grid',gridTemplateColumns:`44px repeat(7,1fr)`,gap:2,marginBottom:2}}>
            <div style={{fontSize:8,color:'var(--t3)',display:'flex',alignItems:'center',justifyContent:'flex-end',paddingRight:4}}>{hlbl(h)}</div>
            {weekDays.map((_,d)=>{
              const k=slotKey(d,h),mine=!!myAvail[k],cnt=counts[k]||0,int=cnt/maxCount;
              return <div key={d} onMouseDown={()=>handleMD(d,h)} onMouseEnter={()=>handleME(d,h)} onTouchStart={()=>handleMD(d,h)}
                style={{height:24,borderRadius:'var(--r-sm)',border:`1px solid ${mine?'var(--green)':cnt>0?'rgba(124,58,237,.5)':'var(--border)'}`,background:mine?'rgba(16,185,129,.5)':cnt>0?`rgba(124,58,237,${int*.5})`:'transparent',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}>
                {cnt>0&&<span style={{fontSize:8,fontWeight:700,color:mine?'#fff':'var(--purple)',opacity:.9}}>{cnt}</span>}
              </div>;
            })}
          </div>)}
        </div>
      </div>
    </>}

    {view==='proben'&&<>
      <div style={{fontSize:11,fontWeight:700,color:'var(--t2)',letterSpacing:.5,textTransform:'uppercase',marginBottom:10}}>Bevorstehende Proben</div>
      {!upcoming5.length&&<Empty icon="📅" title="Keine Proben geplant" sub="Unter + Neu erstellen"/>}
      {upcoming5.map(s=><SessionCard key={s.id} session={s} user={user} profile={profile} members={members} practiceSongs={practiceSongs} editId={editId} setEditId={setEditId} showCommentsId={showCommentsId} setShowCommentsId={setShowCommentsId} onUpdate={updateSess} onDelete={deleteSess}/>)}
      {past5.length>0&&<><div style={{fontSize:11,fontWeight:700,color:'var(--t2)',letterSpacing:.5,textTransform:'uppercase',margin:'16px 0 10px'}}>Vergangene Proben</div>
        {past5.map(s=><SessionCard key={s.id} session={s} user={user} profile={profile} members={members} practiceSongs={practiceSongs} editId={editId} setEditId={setEditId} showCommentsId={showCommentsId} setShowCommentsId={setShowCommentsId} onUpdate={updateSess} onDelete={deleteSess} past/>)}</>}
    </>}

    {view==='create'&&<Card>
      <div style={{display:'flex',flexDirection:'column',gap:12}}>
        <Fld label="Probenname"><Inp value={sf.title} onChange={e=>setSF(f=>({...f,title:e.target.value}))} placeholder="z.B. Probe vor dem Auftritt..."/></Fld>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
          <Fld label="Datum"><Inp type="date" value={sf.date} onChange={e=>setSF(f=>({...f,date:e.target.value}))}/></Fld>
          <Fld label="Uhrzeit"><Inp type="time" value={sf.time} onChange={e=>setSF(f=>({...f,time:e.target.value}))}/></Fld>
        </div>
        <Fld label="Ort">
          <Sel value={sf.location} onChange={e=>setSF(f=>({...f,location:e.target.value}))} options={[{value:'',label:'-- Ort auswählen --'},...locations.map(l=>({value:l.name,label:l.name})),{value:'Im Freien 🌿',label:'Im Freien 🌿 (Standard)'}]}/>
          <div style={{display:'flex',gap:6,marginTop:6}}><Inp value={newLoc} onChange={e=>setNewLoc(e.target.value)} placeholder="Neuen Ort hinzufügen..." style={{fontSize:11}}/><Btn onClick={addLoc} size="sm">+</Btn></div>
        </Fld>
        <Fld label="Verantwortlich"><Sel value={sf.leadId} onChange={e=>setSF(f=>({...f,leadId:e.target.value}))} options={[{value:'',label:'-- Später festlegen --'},...members.map(m=>({value:m.id,label:`${m.displayName} — ${m.role}`}))]}/></Fld>
        <Fld label={`Setliste (${sf.setlist.length} Songs)`}>
          {practiceSongs.length===0?<div style={{fontSize:11,color:'var(--t3)',padding:'6px 0'}}>Noch keine Songs. Songs-Tab öffnen.</div>:practiceSongs.map(s=>{const sel=sf.setlist.find(x=>x.songId===s.id);return <div key={s.id} onClick={()=>toggleSL(s)} style={{display:'flex',alignItems:'center',gap:8,padding:'7px 9px',borderRadius:'var(--r-sm)',border:`1px solid ${sel?'var(--purple)':'var(--border)'}`,background:sel?'rgba(124,58,237,.1)':'transparent',cursor:'pointer',marginBottom:4}}>
            <div style={{width:13,height:13,borderRadius:3,background:sel?'var(--purple)':'transparent',border:`2px solid ${sel?'var(--purple)':'var(--border2)'}`,flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center',fontSize:8,color:'#fff'}}>{sel?'✓':''}</div>
            <span style={{fontSize:12,flex:1}}>{s.title} — <span style={{color:'var(--t2)'}}>{s.artist}</span></span>
            <Badge label={STATUS_MAP[s.status]?.label} color={STATUS_MAP[s.status]?.color} bg={STATUS_MAP[s.status]?.bg}/>
          </div>;})}
        </Fld>
        <Fld label="Notizen"><Txta value={sf.notes} onChange={e=>setSF(f=>({...f,notes:e.target.value}))} placeholder="Vorbereitung, Ausrüstung..." rows={2}/></Fld>
        <div style={{display:'flex',gap:8,justifyContent:'flex-end'}}>
          <Btn onClick={()=>setView('proben')} style={{color:'var(--t2)'}}>Abbrechen</Btn>
          <Btn onClick={createSess} disabled={!sf.date} style={{background:'linear-gradient(135deg,var(--purple),#5B21B6)',color:'#fff',border:'none'}}>Probe erstellen ✓</Btn>
        </div>
      </div>
    </Card>}
  </div>;
}

function SessionCard({session:s,user,profile,members,practiceSongs,editId,setEditId,showCommentsId,setShowCommentsId,onUpdate,onDelete,past}){

            {confirmed>0&&<div style={{fontSize:10,color:'var(--green)',marginTop:2}}>✓ {confirmed} Zusagen</div>}
          </div>
          {!past&&<div style={{display:'flex',gap:5,flexShrink:0}}>
            <button onClick={()=>setEditId(isEdit?null:s.id)} style={{background:'none',border:'none',color:'var(--t2)',cursor:'pointer',fontSize:15,padding:'2px 5px'}} title="Bearbeiten">✏️</button>
            <button onClick={()=>setShowCommentsId(showC?null:s.id)} style={{background:'none',border:'none',color:showC?'var(--purple)':'var(--t2)',cursor:'pointer',fontSize:15,padding:'2px 5px'}} title="Kommentare">💬</button>
          </div>}
        </div>
        {s.setlist?.length>0&&<div style={{marginTop:8,paddingTop:8,borderTop:'1px solid var(--border)'}}>
          <div style={{fontSize:10,color:'var(--t3)',marginBottom:4}}>Setliste ({s.setlist.length})</div>
          <div style={{display:'flex',gap:4,flexWrap:'wrap'}}>

        </div>}
        {showC&&<div style={{marginTop:10,paddingTop:10,borderTop:'1px solid var(--border)'}}>
          <CommentsThread collection="sessionComments" docId={s.id} user={user} profile={profile} members={members}/>

    </Card>
  </div>;

function SongsPage({user,profile,allSongs,members}){
  const[filter,setFilter]=useState('all');
  const[exp,setExp]=useState(null);
  const[addForm,setAddForm]=useState(false);
  const[nf,setNF]=useState({title:'',artist:'',genre:'',status:'practicing',youtubeLink:'',spotifyLink:''});
  const[editSongId,setEditSongId]=useState(null);
  const[editSF,setEditSF]=useState({});
  const[playingId,setPlayingId]=useState(null);
  const[editNotes,setEditNotes]=useState({});
  const[addRole,setAddRole]=useState({});
  const[groupByArtist,setGroupByArtist]=useState(false);

  const practiceSongs=allSongs.filter(s=>s.status!=='suggested');
  const filtered=filter==='all'?practiceSongs:practiceSongs.filter(s=>s.status===filter);

  const addSong=async()=>{if(!nf.title||!nf.artist)return;await db.collection('songs').add({...nf,suggestedBy:user.uid,suggestedByName:profile.displayName,votes:[],roleAssignments:[],structureNotes:'',createdAt:firebase.firestore.FieldValue.serverTimestamp()});setNF({title:'',artist:'',genre:'',status:'practicing',youtubeLink:'',spotifyLink:''});setAddForm(false);};
  const updateSong=async id=>{await db.collection('songs').doc(id).update(editSF);setEditSongId(null);};
  const startEdit=song=>{setEditSF({title:song.title||'',artist:song.artist||'',genre:song.genre||'',status:song.status||'practicing',youtubeLink:song.youtubeLink||'',spotifyLink:song.spotifyLink||''});setEditSongId(song.id);};
  const updStatus=async(id,status)=>db.collection('songs').doc(id).update({status});
  const saveNotes=async id=>db.collection('songs').doc(id).update({structureNotes:editNotes[id]||''});
  const addMyRole=async(songId,song)=>{const r=addRole[songId];if(!r?.songRole)return;const ex=song.roleAssignments||[];if(ex.find(x=>x.userId===user.uid))return;await db.collection('songs').doc(songId).update({roleAssignments:[...ex,{userId:user.uid,userName:profile.displayName,userBandRole:profile.role,songRole:r.songRole}]});setAddRole(p=>({...p,[songId]:{}}));};
  const removeMyRole=async(songId,song)=>db.collection('songs').doc(songId).update({roleAssignments:(song.roleAssignments||[]).filter(x=>x.userId!==user.uid)});
  const delSong=async id=>{if(window.confirm('Song löschen?'))await db.collection('songs').doc(id).delete();};

    const isOpen=exp===song.id,sm=STATUS_MAP[song.status],mr=(song.roleAssignments||[]).find(r=>r.userId===user.uid),isEdit=editSongId===song.id,ytId=extractYTId(song.youtubeLink);

              <span style={{fontWeight:700,fontSize:13}}>{song.title}</span>
              <Badge label={sm?.label} color={sm?.color} bg={sm?.bg}/>
            </div>
            <div style={{fontSize:11,color:'var(--t2)'}}>{song.artist}{song.genre&&` · ${song.genre}`}</div>
            {mr&&<div style={{fontSize:10,color:'var(--cyan)',marginTop:1}}>Meine Rolle: {mr.songRole}</div>}
          </div>
          {ytId&&<button onClick={e=>{e.stopPropagation();setPlayingId(playingId===song.id?null:song.id);}} style={{background:playingId===song.id?'rgba(239,68,68,.25)':'rgba(239,68,68,.12)',border:'1px solid rgba(239,68,68,.4)',borderRadius:'var(--r-pill)',color:'var(--red)',padding:'4px 9px',fontSize:11,fontWeight:700,cursor:'pointer',flexShrink:0,display:'flex',alignItems:'center',gap:3}}>▶</button>}
          <span style={{fontSize:10,color:'var(--t3)',flexShrink:0}}>{isOpen?'▲':'▼'}</span>
        </div>
        {ytId&&playingId===song.id&&<div style={{marginTop:8,borderRadius:'var(--r-sm)',overflow:'hidden',background:'#000',position:'relative'}}>
          <button onClick={()=>setPlayingId(null)} style={{position:'absolute',top:6,right:6,zIndex:10,background:'rgba(0,0,0,.7)',border:'none',color:'#fff',borderRadius:'50%',width:24,height:24,cursor:'pointer',fontSize:13,display:'flex',alignItems:'center',justifyContent:'center',lineHeight:1}}>×</button>
          <iframe width="100%" height="210" src={`https://www.youtube.com/embed/${ytId}?autoplay=1`} title={song.title} frameBorder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowFullScreen style={{display:'block'}}/>
        </div>}
        {isOpen&&<div style={{borderTop:'1px solid var(--border)',marginTop:10,paddingTop:10,display:'flex',flexDirection:'column',gap:12}}>
          <div>
            <div style={{fontSize:10,fontWeight:700,color:'var(--t2)',letterSpacing:.5,marginBottom:6}}>STATUS</div>
            <div style={{display:'flex',gap:4,flexWrap:'wrap'}}>
              {Object.entries(STATUS_MAP).filter(([k])=>k!=='suggested').map(([k,v])=><button key={k} onClick={()=>updStatus(song.id,k)} style={{padding:'4px 9px',borderRadius:'var(--r-sm)',border:`1px solid ${song.status===k?v.color:'var(--border)'}`,background:song.status===k?v.bg:'transparent',color:song.status===k?v.color:'var(--t3)',fontSize:11,fontWeight:600,cursor:'pointer'}}>{v.label}</button>)}
            </div>
          </div>
          <div>
            <div style={{fontSize:10,fontWeight:700,color:'var(--t2)',letterSpacing:.5,marginBottom:5}}>STRUKTURNOTIZEN</div>
            <Txta value={editNotes[song.id]??song.structureNotes??''} onChange={e=>setEditNotes(p=>({...p,[song.id]:e.target.value}))} placeholder="Intro, Outro, Tonart, Übergänge..." rows={2}/>
            <Btn onClick={()=>saveNotes(song.id)} size="sm" style={{marginTop:5}}>Speichern</Btn>
          </div>
          <div>
            <div style={{fontSize:10,fontWeight:700,color:'var(--t2)',letterSpacing:.5,marginBottom:6}}>ROLLENVERTEILUNG</div>
            {(song.roleAssignments||[]).map((r,i)=><div key={i} style={{display:'flex',alignItems:'center',gap:7,padding:'4px 0',borderBottom:'1px solid var(--border)'}}>
              <Av emoji={members.find(m=>m.id===r.userId)?.avatar} size={22}/>
              <span style={{fontSize:11,flex:1}}>{r.userName}</span>
              <Badge label={r.userBandRole} color={ROLE_COLORS[r.userBandRole]} bg='var(--surf3)'/>

              {r.userId===user.uid&&<button onClick={()=>removeMyRole(song.id,song)} style={{background:'none',border:'none',color:'var(--t3)',cursor:'pointer',fontSize:13}}>×</button>}
            </div>)}
            {!mr&&<div style={{display:'flex',gap:5,marginTop:6}}>
              <Sel value={addRole[song.id]?.songRole||''} onChange={e=>setAddRole(p=>({...p,[song.id]:{songRole:e.target.value}}))} options={[{value:'',label:'Meine Rolle...'},...SONG_ROLES]} style={{flex:1,fontSize:11}}/>
              <Btn onClick={()=>addMyRole(song.id,song)} size="sm" style={{background:'var(--purple)',color:'#fff',border:'none'}}>+</Btn>

          </div>
          <div>
            <div style={{fontSize:10,fontWeight:700,color:'var(--t2)',letterSpacing:.5,marginBottom:6}}>KOMMENTARE</div>
            <CommentsThread collection="comments" docId={song.id} user={user} profile={profile} members={members}/>
          </div>
          {/* LINKS */}
          {(song.youtubeLink||song.spotifyLink)&&<div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
            {song.youtubeLink&&<a href={song.youtubeLink} target="_blank" rel="noopener noreferrer" style={{fontSize:11,padding:'4px 10px',borderRadius:'var(--r-pill)',background:'rgba(239,68,68,.15)',color:'var(--red)',textDecoration:'none'}}>▶ YouTube</a>}
            {song.spotifyLink&&<a href={song.spotifyLink} target="_blank" rel="noopener noreferrer" style={{fontSize:11,padding:'4px 10px',borderRadius:'var(--r-pill)',background:'rgba(16,185,129,.15)',color:'var(--green)',textDecoration:'none'}}>♫ Spotify</a>}
          </div>}
          {/* EDIT FORM */}
          {isEdit&&<div style={{background:'var(--surf2)',borderRadius:'var(--r-sm)',padding:12,display:'flex',flexDirection:'column',gap:10,border:'1px solid var(--gold)'}}>
            <div style={{fontSize:10,fontWeight:700,color:'var(--gold)',letterSpacing:.5}}>✏️ SONG BEARBEITEN</div>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
              <Fld label="Songname"><Inp value={editSF.title} onChange={e=>setEditSF(p=>({...p,title:e.target.value}))}/></Fld>
              <Fld label="Künstler"><Inp value={editSF.artist} onChange={e=>setEditSF(p=>({...p,artist:e.target.value}))}/></Fld>
            </div>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>

            </div>
            <Fld label="YouTube-Link"><Inp value={editSF.youtubeLink} onChange={e=>setEditSF(p=>({...p,youtubeLink:e.target.value}))} placeholder="https://youtube.com/..."/></Fld>
            <Fld label="Spotify-Link"><Inp value={editSF.spotifyLink} onChange={e=>setEditSF(p=>({...p,spotifyLink:e.target.value}))} placeholder="https://open.spotify.com/..."/></Fld>
            <div style={{display:'flex',gap:7,justifyContent:'flex-end'}}>
              <Btn onClick={()=>setEditSongId(null)} style={{color:'var(--t2)'}}>Abbrechen</Btn>
              <Btn onClick={()=>updateSong(song.id)} style={{background:'var(--green)',color:'#fff',border:'none'}}>Speichern ✓</Btn>
            </div>
          </div>}
          <div style={{display:'flex',gap:7,paddingTop:6,borderTop:'1px solid var(--border)'}}>
            <Btn onClick={()=>{startEdit(song);}} size="sm" style={{background:'rgba(245,158,11,.12)',color:'var(--gold)',border:'1px solid rgba(245,158,11,.3)'}}>✏️ Bearbeiten</Btn>
            <Btn onClick={()=>delSong(song.id)} size="sm" style={{background:'rgba(239,68,68,.1)',color:'var(--red)',border:'1px solid rgba(239,68,68,.3)'}}>🗑 Entfernen</Btn>
          </div>
        </div>}
      </Card>
    </div>;
  };

  return <div style={{padding:'16px 16px 90px'}}>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
      <div style={{fontSize:17,fontWeight:800}}>🎵 Songs in Übung</div>
      <div style={{display:'flex',gap:5}}>
        <Btn onClick={()=>setGroupByArtist(v=>!v)} size="sm" style={{background:groupByArtist?'var(--surf3)':'transparent',color:'var(--t2)'}}>Nach Künstler</Btn>
        <Btn onClick={()=>setAddForm(v=>!v)} size="sm" style={{background:addForm?'var(--surf3)':'var(--purple)',color:'#fff',border:'none'}}>{addForm?'×':'+ Song'}</Btn>

      <div style={{display:'flex',flexDirection:'column',gap:10}}>

        </div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
          <Fld label="Genre"><Sel value={nf.genre} onChange={e=>setNF(p=>({...p,genre:e.target.value}))} options={[{value:'',label:'Genre...'},...GENRES]}/></Fld>
          <Fld label="Status"><Sel value={nf.status} onChange={e=>setNF(p=>({...p,status:e.target.value}))} options={Object.entries(STATUS_MAP).filter(([k])=>k!=='suggested').map(([k,v])=>({value:k,label:v.label}))}/></Fld>
        </div>
        <Fld label="YouTube-Link"><Inp value={nf.youtubeLink} onChange={e=>setNF(p=>({...p,youtubeLink:e.target.value}))} placeholder="https://youtube.com/..."/></Fld>
        <Fld label="Spotify-Link"><Inp value={nf.spotifyLink} onChange={e=>setNF(p=>({...p,spotifyLink:e.target.value}))} placeholder="https://open.spotify.com/..."/></Fld>
        <div style={{display:'flex',gap:8,justifyContent:'flex-end'}}>
          <Btn onClick={()=>setAddForm(false)} style={{color:'var(--t2)'}}>Abbrechen</Btn>
          <Btn onClick={addSong} disabled={!nf.title||!nf.artist} style={{background:'var(--green)',color:'#fff',border:'none'}}>Hinzufügen ✓</Btn>
        </div>
      </div>
    </Card>}
    <div style={{display:'flex',gap:5,marginBottom:12,overflowX:'auto',paddingBottom:2}}>
      <PillBtn active={filter==='all'} onClick={()=>setFilter('all')}>Alle ({practiceSongs.length})</PillBtn>
      {Object.entries(STATUS_MAP).filter(([k])=>k!=='suggested').map(([k,v])=><PillBtn key={k} active={filter===k} onClick={()=>setFilter(k)} color={v.color}>{v.label} ({practiceSongs.filter(s=>s.status===k).length})</PillBtn>)}
    </div>
    {!filtered.length&&<Empty icon="🎵" title="Keine Songs" sub="Song hinzufügen oder aus Vorschlägen übernehmen."/>}
    {groupByArtist
      ?Object.entries(artistGroups).sort(([a],[b])=>a.localeCompare(b)).map(([artist,songs])=><div key={artist}><div style={{fontSize:11,fontWeight:700,color:'var(--t2)',letterSpacing:.5,textTransform:'uppercase',margin:'10px 0 6px'}}>🎤 {artist} ({songs.length})</div>{songs.map(renderSong)}</div>)
      :filtered.map(renderSong)}
  </div>;
}

//  SUGGEST PAGE (fixed)
// ════════════════════════════════════════════════════
function SuggestPage({user,profile,allSongs}){
  const[showForm,setShowForm]=useState(false);
  const[nf,setNF]=useState({title:'',artist:'',genre:'',youtubeLink:'',spotifyLink:''});
  const[saving,setSaving]=useState(false);
  const[moving,setMoving]=useState(null);
  const[groupBy,setGroupBy]=useState(false);
  const[playingId,setPlayingId]=useState(null);

  const suggested=allSongs.filter(s=>s.status==='suggested').sort((a,b)=>(b.votes?.length||0)-(a.votes?.length||0));

  const submit=async()=>{
    if(!nf.title||!nf.artist)return;
    setSaving(true);
    await db.collection('songs').add({...nf,status:'suggested',suggestedBy:user.uid,suggestedByName:profile.displayName,votes:[user.uid],roleAssignments:[],structureNotes:'',createdAt:firebase.firestore.FieldValue.serverTimestamp()});
    setNF({title:'',artist:'',genre:'',youtubeLink:'',spotifyLink:''});setShowForm(false);setSaving(false);
  };
  const vote=async song=>{const v=song.votes?.includes(user.uid);await db.collection('songs').doc(song.id).update({votes:v?firebase.firestore.FieldValue.arrayRemove(user.uid):firebase.firestore.FieldValue.arrayUnion(user.uid)});};
  const move=async song=>{setMoving(song.id);await db.collection('songs').doc(song.id).update({status:'practicing',movedAt:firebase.firestore.FieldValue.serverTimestamp()});setMoving(null);};

  const artistGroups=useMemo(()=>{const g={};suggested.forEach(s=>{if(!g[s.artist])g[s.artist]=[];g[s.artist].push(s);});return g;},[suggested]);

  const renderSong=song=>{const voted=song.votes?.includes(user.uid),vc=song.votes?.length||0,ytId2=extractYTId(song.youtubeLink);
    return <Card key={song.id} style={{marginBottom:9}}>

        <div style={{flex:1}}>
          <div style={{fontWeight:700,fontSize:13}}>{song.title}</div>
          <div style={{fontSize:11,color:'var(--t2)',marginTop:2}}>{song.artist}{song.genre&&` · ${song.genre}`}</div>
          <div style={{fontSize:10,color:'var(--t3)',marginTop:2}}>Vorgeschlagen von {song.suggestedByName}</div>
          <div style={{display:'flex',gap:5,marginTop:7,flexWrap:'wrap'}}>
            {ytId2&&<button onClick={()=>setPlayingId(playingId===song.id?null:song.id)} style={{fontSize:10,padding:'3px 9px',borderRadius:'var(--r-pill)',background:playingId===song.id?'rgba(239,68,68,.3)':'rgba(239,68,68,.15)',color:'var(--red)',border:'1px solid rgba(239,68,68,.3)',cursor:'pointer',fontWeight:700}}>▶ {playingId===song.id?'Schließen':'YouTube'}</button>}
            {song.spotifyLink&&<a href={song.spotifyLink} target="_blank" rel="noopener noreferrer" style={{fontSize:10,padding:'2px 8px',borderRadius:'var(--r-pill)',background:'rgba(16,185,129,.15)',color:'var(--green)',textDecoration:'none'}}>♫ Spotify</a>}
          </div>
        </div>
        <div style={{display:'flex',flexDirection:'column',gap:5,alignItems:'flex-end',flexShrink:0}}>
          <button onClick={()=>vote(song)} style={{display:'flex',alignItems:'center',gap:4,padding:'6px 11px',borderRadius:'var(--r-sm)',border:`1px solid ${voted?'var(--gold)':'var(--border2)'}`,background:voted?'rgba(245,158,11,.15)':'transparent',color:voted?'var(--gold)':'var(--t2)',cursor:'pointer',fontWeight:700,fontSize:12}}>🔥 {vc}</button>
          <button onClick={()=>move(song)} disabled={moving===song.id} style={{padding:'6px 9px',borderRadius:'var(--r-sm)',border:'1px solid var(--green)',background:'rgba(16,185,129,.1)',color:'var(--green)',cursor:'pointer',fontWeight:700,fontSize:11,whiteSpace:'nowrap'}}>{moving===song.id?'...':'→ Üben'}</button>
        </div>
      </div>
      {ytId2&&playingId===song.id&&<div style={{marginTop:10,borderRadius:'var(--r-sm)',overflow:'hidden',background:'#000',position:'relative'}}>
        <button onClick={()=>setPlayingId(null)} style={{position:'absolute',top:6,right:6,zIndex:10,background:'rgba(0,0,0,.7)',border:'none',color:'#fff',borderRadius:'50%',width:22,height:22,cursor:'pointer',fontSize:12,display:'flex',alignItems:'center',justifyContent:'center'}}>×</button>
        <iframe width="100%" height="200" src={`https://www.youtube.com/embed/${ytId2}?autoplay=1`} title={song.title} frameBorder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowFullScreen style={{display:'block'}}/>
      </div>}
    </Card>;};

  return <div style={{padding:'16px 16px 90px'}}>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
      <div style={{fontSize:17,fontWeight:800}}>💡 Vorschläge</div>
      <div style={{display:'flex',gap:5}}>
        <Btn onClick={()=>setGroupBy(v=>!v)} size="sm" style={{color:'var(--t2)',background:groupBy?'var(--surf3)':'transparent'}}>Nach Künstler</Btn>
        <Btn onClick={()=>setShowForm(v=>!v)} size="sm" style={{background:showForm?'var(--surf3)':'var(--purple)',color:'#fff',border:'none'}}>{showForm?'×':'+ Vorschlag'}</Btn>
      </div>
    </div>
    {showForm&&<Card style={{marginBottom:14}}>
      <div style={{display:'flex',flexDirection:'column',gap:10}}>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
          <Fld label="Songname *"><Inp value={nf.title} onChange={e=>setNF(p=>({...p,title:e.target.value}))} placeholder="Songname..."/></Fld>
          <Fld label="Künstler *"><Inp value={nf.artist} onChange={e=>setNF(p=>({...p,artist:e.target.value}))} placeholder="Künstlername..."/></Fld>
        </div>
        <Fld label="Genre"><Sel value={nf.genre} onChange={e=>setNF(p=>({...p,genre:e.target.value}))} options={[{value:'',label:'Genre...'},...GENRES]}/></Fld>
        <Fld label="YouTube-Link"><Inp value={nf.youtubeLink} onChange={e=>setNF(p=>({...p,youtubeLink:e.target.value}))} placeholder="https://youtube.com/..."/></Fld>
        <Fld label="Spotify-Link"><Inp value={nf.spotifyLink} onChange={e=>setNF(p=>({...p,spotifyLink:e.target.value}))} placeholder="https://open.spotify.com/..."/></Fld>
        <Btn onClick={submit} disabled={saving||!nf.title||!nf.artist} style={{background:'linear-gradient(135deg,var(--purple),#5B21B6)',color:'#fff',border:'none'}}>{saving?'Wird gespeichert...':'Vorschlag einreichen'}</Btn>
      </div>
    </Card>}
    {!suggested.length&&<Empty icon="💡" title="Noch keine Vorschläge" sub="Sei der Erste!"/>}
    {groupBy?Object.entries(artistGroups).sort(([a],[b])=>a.localeCompare(b)).map(([artist,songs])=><div key={artist}><div style={{fontSize:11,fontWeight:700,color:'var(--t2)',letterSpacing:.5,textTransform:'uppercase',margin:'10px 0 6px'}}>🎤 {artist} ({songs.length})</div>{songs.map(renderSong)}</div>):suggested.map(renderSong)}
  </div>;
}

// ════════════════════════════════════════════════════
//  PROFILE PAGE
// ════════════════════════════════════════════════════
function ProfilePage({user,profile,setProfile,design,onDesignUpdate,bandName,setBandName}){
  const[ptab,setPtab]=useState('info');
  const[edit,setEdit]=useState(false);
  const[form,setForm]=useState(null);
  const[saving,setSaving]=useState(false);
  const[skillIn,setSkillIn]=useState('');
  const[addPS,setAddPS]=useState({title:'',artist:'',roles:[]});
  const[addFav,setAddFav]=useState({title:'',artist:''});

  useEffect(()=>{if(profile)setForm({...profile});},[profile]);
  const save=async()=>{setSaving(true);await db.collection('users').doc(user.uid).update({displayName:form.displayName,role:form.role,bio:form.bio,avatar:form.avatar,skills:form.skills||[]});setProfile(p=>({...p,...form}));setEdit(false);setSaving(false);};
  const addSkill=()=>{if(!skillIn.trim())return;setForm(p=>({...p,skills:[...(p.skills||[]),skillIn.trim()]}));setSkillIn('');};
  const rmSkill=i=>setForm(p=>({...p,skills:p.skills.filter((_,j)=>j!==i)}));
  const addPlayable=async()=>{if(!addPS.title||!addPS.artist)return;const l=[...(profile.playableSongs||[]),{id:uid(),...addPS}];await db.collection('users').doc(user.uid).update({playableSongs:l});setProfile(p=>({...p,playableSongs:l}));setAddPS({title:'',artist:'',roles:[]});};
  const rmPlayable=async id=>{const l=(profile.playableSongs||[]).filter(s=>s.id!==id);await db.collection('users').doc(user.uid).update({playableSongs:l});setProfile(p=>({...p,playableSongs:l}));};
  const addFavorite=async()=>{if(!addFav.title||!addFav.artist)return;const l=[...(profile.favoriteSongs||[]),{id:uid(),...addFav}];await db.collection('users').doc(user.uid).update({favoriteSongs:l});setProfile(p=>({...p,favoriteSongs:l}));setAddFav({title:'',artist:''});};
  const rmFav=async id=>{const l=(profile.favoriteSongs||[]).filter(s=>s.id!==id);await db.collection('users').doc(user.uid).update({favoriteSongs:l});setProfile(p=>({...p,favoriteSongs:l}));};
  const saveBandName=async()=>{await db.collection('settings').doc('main').set({bandName},{merge:true});};

  if(!profile||!form)return <div style={{display:'flex',justifyContent:'center',padding:40}}><div className="spin"/></div>;

  const PTABS=[{k:'info',l:'Profil'},{k:'music',l:'Musik'},{k:'design',l:'🎨 Design'},{k:'band',l:'⚙️ Band'}];
  return <div style={{padding:'16px 16px 90px'}}>
    {/* Profile header */}
    <div style={{position:'relative',borderRadius:'var(--r-lg)',overflow:'hidden',marginBottom:14,background:'linear-gradient(135deg,rgba(50,0,80,.6) 0%,var(--surf) 100%)',padding:'20px 16px'}}>
      <div style={{position:'absolute',top:-20,right:-20,width:100,height:100,borderRadius:'50%',background:'radial-gradient(circle,rgba(124,58,237,.25) 0%,transparent 70%)'}}/>
      <div style={{display:'flex',alignItems:'center',gap:14,position:'relative'}}>
        <div style={{width:58,height:58,borderRadius:'50%',background:(ROLE_COLORS[profile.role]||'#888')+'33',display:'flex',alignItems:'center',justifyContent:'center',fontSize:28,border:'2px solid var(--purple)'}}>
          {profile.avatar||'🎵'}
        </div>
        <div style={{flex:1}}>
          <div style={{fontSize:19,fontWeight:800}}>{profile.displayName}</div>
          <div style={{fontSize:12,color:ROLE_COLORS[profile.role]||'var(--t2)',fontWeight:600,marginTop:2}}>{profile.role}</div>
          {profile.skills?.length>0&&<div style={{display:'flex',gap:3,flexWrap:'wrap',marginTop:6}}>{profile.skills.slice(0,3).map((s,i)=><Badge key={i} label={s} color='var(--purple)' bg='rgba(124,58,237,.12)'/>)}</div>}
        </div>
        <button onClick={()=>{setEdit(true);setPtab('info');}} style={{background:'var(--surf2)',border:'1px solid var(--border2)',borderRadius:'var(--r-sm)',color:'var(--t2)',padding:'6px 10px',cursor:'pointer',fontSize:11,fontWeight:600}}>✏️ Bearbeiten</button>
      </div>
      {profile.bio&&<div style={{marginTop:12,fontSize:12,color:'var(--t2)',lineHeight:1.6,padding:'8px 10px',background:'rgba(0,0,0,.25)',borderRadius:'var(--r-sm)',position:'relative'}}>{profile.bio}</div>}
    </div>
    <div style={{display:'flex',gap:5,marginBottom:14,overflowX:'auto',paddingBottom:2}}>
      {PTABS.map(t=><PillBtn key={t.k} active={ptab===t.k} onClick={()=>setPtab(t.k)}>{t.l}</PillBtn>)}
    </div>

    {ptab==='info'&&(edit?<Card>
      <div style={{fontSize:10,fontWeight:700,color:'var(--purple)',marginBottom:8}}>AVATAR</div>
      <div style={{display:'flex',gap:4,flexWrap:'wrap',marginBottom:12}}>{AVATARS.map(e=><button key={e} onClick={()=>setForm(p=>({...p,avatar:e}))} style={{fontSize:20,padding:4,borderRadius:'var(--r-sm)',border:`2px solid ${form.avatar===e?'var(--purple)':'transparent'}`,background:'transparent',cursor:'pointer'}}>{e}</button>)}</div>
      <div style={{display:'flex',flexDirection:'column',gap:10}}>
        <Fld label="Name"><Inp value={form.displayName} onChange={e=>setForm(p=>({...p,displayName:e.target.value}))}/></Fld>
        <Fld label="Rolle"><Sel value={form.role} onChange={e=>setForm(p=>({...p,role:e.target.value}))} options={BAND_ROLES}/></Fld>
        <Fld label="Über mich"><Txta value={form.bio||''} onChange={e=>setForm(p=>({...p,bio:e.target.value}))} placeholder="Stil, Einflüsse, Träume..." rows={3}/></Fld>
        <Fld label={`Fähigkeiten (${form.skills?.length||0})`}>
          <div style={{display:'flex',gap:4,flexWrap:'wrap',marginBottom:6}}>{(form.skills||[]).map((s,i)=><div key={i} style={{display:'flex',alignItems:'center',gap:3,padding:'3px 8px',borderRadius:'var(--r-pill)',background:'rgba(124,58,237,.15)',border:'1px solid rgba(124,58,237,.3)'}}><span style={{fontSize:11,color:'var(--purple)'}}>{s}</span><button onClick={()=>rmSkill(i)} style={{background:'none',border:'none',color:'var(--t3)',cursor:'pointer',fontSize:12}}>×</button></div>)}</div>
          <div style={{display:'flex',gap:5}}><Inp value={skillIn} onChange={e=>setSkillIn(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addSkill()} placeholder="Fähigkeit..." style={{fontSize:12}}/><Btn onClick={addSkill} size="sm">+</Btn></div>
        </Fld>
      </div>
      <div style={{display:'flex',gap:7,marginTop:12,justifyContent:'flex-end'}}>
        <Btn onClick={()=>{setEdit(false);setForm({...profile});}} style={{color:'var(--t2)'}}>Abbrechen</Btn>
        <Btn onClick={save} disabled={saving} style={{background:'linear-gradient(135deg,var(--purple),#5B21B6)',color:'#fff',border:'none'}}>{saving?'Speichern...':'Änderungen speichern'}</Btn>
      </div>
    </Card>:<div style={{color:'var(--t2)',fontSize:13,textAlign:'center',padding:'10px 0'}}>Profil-Daten oben sichtbar. <span onClick={()=>setEdit(true)} style={{color:'var(--purple)',cursor:'pointer',fontWeight:600}}>Bearbeiten →</span></div>)}

    {ptab==='music'&&<>
      <div style={{fontSize:11,fontWeight:700,color:'var(--t2)',letterSpacing:.5,textTransform:'uppercase',marginBottom:10}}>Spielbare Songs</div>
      {(profile.playableSongs||[]).map(s=><Card key={s.id} style={{marginBottom:7,padding:'10px 13px'}}>
        <div style={{display:'flex',alignItems:'center',gap:9}}>
          <div style={{flex:1}}><div style={{fontWeight:700,fontSize:13}}>{s.title}</div><div style={{fontSize:11,color:'var(--t2)'}}>{s.artist}</div>{s.roles?.length>0&&<div style={{display:'flex',gap:3,marginTop:4,flexWrap:'wrap'}}>{s.roles.map((r,i)=><Badge key={i} label={r} color='var(--cyan)' bg='rgba(6,182,212,.1)'/>)}</div>}</div>
          <button onClick={()=>rmPlayable(s.id)} style={{background:'none',border:'none',color:'var(--t3)',cursor:'pointer',fontSize:17}}>×</button>
        </div>
      </Card>)}
      <Card style={{marginBottom:18}}>
        <div style={{display:'flex',flexDirection:'column',gap:8}}>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
            <Inp value={addPS.title} onChange={e=>setAddPS(p=>({...p,title:e.target.value}))} placeholder="Songname..."/>
            <Inp value={addPS.artist} onChange={e=>setAddPS(p=>({...p,artist:e.target.value}))} placeholder="Künstler..."/>
          </div>
          <div style={{display:'flex',gap:4,flexWrap:'wrap'}}>{SONG_ROLES.map(r=><button key={r} onClick={()=>setAddPS(p=>({...p,roles:p.roles.includes(r)?p.roles.filter(x=>x!==r):[...p.roles,r]}))} style={{padding:'3px 8px',borderRadius:'var(--r-sm)',border:`1px solid ${addPS.roles.includes(r)?'var(--purple)':'var(--border)'}`,background:addPS.roles.includes(r)?'rgba(124,58,237,.15)':'transparent',color:addPS.roles.includes(r)?'var(--purple)':'var(--t3)',fontSize:11,cursor:'pointer'}}>{r}</button>)}</div>
          <Btn onClick={addPlayable} size="sm" style={{alignSelf:'flex-end'}}>+ Song hinzufügen</Btn>
        </div>
      </Card>
      <div style={{fontSize:11,fontWeight:700,color:'var(--t2)',letterSpacing:.5,textTransform:'uppercase',marginBottom:10}}>Lieblingslieder</div>
      {(profile.favoriteSongs||[]).map(s=><Card key={s.id} style={{marginBottom:6,padding:'9px 13px',display:'flex',alignItems:'center',gap:9}}>
        <span style={{fontSize:15}}>♥️</span>
        <div style={{flex:1}}><div style={{fontWeight:600,fontSize:13}}>{s.title}</div><div style={{fontSize:11,color:'var(--t2)'}}>{s.artist}</div></div>
        <button onClick={()=>rmFav(s.id)} style={{background:'none',border:'none',color:'var(--t3)',cursor:'pointer',fontSize:17}}>×</button>
      </Card>)}
      <Card><div style={{display:'flex',gap:6}}>
        <Inp value={addFav.title} onChange={e=>setAddFav(p=>({...p,title:e.target.value}))} placeholder="Lieblingstitel..."/>
        <Inp value={addFav.artist} onChange={e=>setAddFav(p=>({...p,artist:e.target.value}))} placeholder="Künstler..."/>
        <Btn onClick={addFavorite} size="sm" style={{flexShrink:0}}>+</Btn>
      </div></Card>
    </>}

    {ptab==='design'&&<>
      <div style={{fontSize:11,fontWeight:700,color:'var(--t2)',letterSpacing:.5,textTransform:'uppercase',marginBottom:10}}>Farbschema</div>
      <div style={{display:'flex',flexDirection:'column',gap:6,marginBottom:16}}>
        {Object.entries(THEMES).map(([name,t])=><button key={name} onClick={()=>onDesignUpdate({theme:name})} style={{display:'flex',alignItems:'center',gap:10,padding:'10px 12px',borderRadius:'var(--r-sm)',border:`1px solid ${design.theme===name?t.purple:'var(--border)'}`,background:design.theme===name?t.surf:'var(--surf2)',cursor:'pointer',textAlign:'left'}}>
          <div style={{display:'flex',gap:4}}>{[t.purple,t.gold,t.green,t.pink].map((c,i)=><div key={i} style={{width:10,height:10,borderRadius:'50%',background:c}}/>)}</div>
          <span style={{fontSize:13,fontWeight:600,color:design.theme===name?t.text:'var(--t2)'}}>{name}</span>
          {design.theme===name&&<span style={{marginLeft:'auto',fontSize:10,color:t.purple,fontWeight:700}}>✓ Aktiv</span>}
        </button>)}
      </div>
      <div style={{fontSize:11,fontWeight:700,color:'var(--t2)',letterSpacing:.5,textTransform:'uppercase',marginBottom:8}}>Ecken — {design.radius}px</div>
      <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:16}}>
        <span style={{fontSize:10,color:'var(--t3)',flexShrink:0}}>Eckig</span>
        <input type="range" min="0" max="20" value={design.radius} onChange={e=>onDesignUpdate({radius:+e.target.value})}/>
        <span style={{fontSize:10,color:'var(--t3)',flexShrink:0}}>Rund</span>
        <div style={{width:28,height:28,border:'2px solid var(--purple)',borderRadius:`${design.radius}px`,flexShrink:0}}/>
      </div>
      <div style={{fontSize:11,fontWeight:700,color:'var(--t2)',letterSpacing:.5,textTransform:'uppercase',marginBottom:8}}>Schriftart</div>
      <div style={{display:'flex',flexDirection:'column',gap:5}}>
        {Object.entries(FONTS).map(([name,f])=><button key={name} onClick={()=>onDesignUpdate({font:name})} style={{padding:'9px 13px',borderRadius:'var(--r-sm)',border:`1px solid ${design.font===name?'var(--purple)':'var(--border)'}`,background:design.font===name?'rgba(124,58,237,.1)':'var(--surf2)',color:design.font===name?'var(--text)':'var(--t2)',fontFamily:f,fontSize:14,fontWeight:600,cursor:'pointer',textAlign:'left',display:'flex',justifyContent:'space-between'}}>
          <span>{name} — <span style={{fontWeight:400,fontSize:12}}>BandSync Probe</span></span>
          {design.font===name&&<span style={{fontSize:10,color:'var(--purple)',fontWeight:700}}>✓</span>}
        </button>)}
      </div>
    </>}

    {ptab==='band'&&<Card>
      <div style={{fontSize:11,fontWeight:700,color:'var(--t2)',letterSpacing:.5,textTransform:'uppercase',marginBottom:10}}>Band-Name (im Dashboard)</div>
      <div style={{display:'flex',gap:7}}>
        <Inp value={bandName} onChange={e=>setBandName(e.target.value)} placeholder="Name deiner Band..."/>
        <Btn onClick={saveBandName} style={{background:'var(--purple)',color:'#fff',border:'none',flexShrink:0}}>Speichern</Btn>
      </div>
      <div style={{marginTop:20,paddingTop:16,borderTop:'1px solid var(--border)'}}>
        <button onClick={()=>auth.signOut()} style={{width:'100%',padding:'11px',borderRadius:'var(--r)',border:'1px solid var(--border2)',background:'transparent',color:'var(--t2)',fontSize:13,cursor:'pointer'}}>Abmelden</button>
      </div>
    </Card>}
  </div>;
}

// ════════════════════════════════════════════════════
//  MAIN APP
// ════════════════════════════════════════════════════
function App(){
  const[authState,setAuthState]=useState('checking');
  const[user,setUser]=useState(null);
  const[profile,setProfile]=useState(null);
  const[tab,setTab]=useState('dashboard');
  const[design,setDesign]=useState(()=>loadDesign());
  const[allSessions,setAllSessions]=useState([]);
  const[allSongs,setAllSongs]=useState([]);
  const[members,setMembers]=useState([]);
  const[bandName,setBandName]=useState('BAND NAME');

  useEffect(()=>{ applyDesign(design); },[design]);
  const handleDesignUpdate=useCallback(patch=>{
    setDesign(prev=>{ const n={...prev,...patch}; localStorage.setItem(DESIGN_LS,JSON.stringify(n)); applyDesign(n); return n; });
  },[]);

  useEffect(()=>{
    if(!hasConfig()){setAuthState('no-config');return;}
    if(!initFB()){setAuthState('no-config');return;}
    const u=auth.onAuthStateChanged(async user=>{
      if(user){
        setUser(user);
        const d=await db.collection('users').doc(user.uid).get();
        if(d.exists)setProfile({id:d.id,...d.data()});
        setAuthState('signed-in');
      }else{setAuthState('signed-out');}
    });
    return u;
  },[]);

  // Load all data globally — NO compound queries, all filter client-side
  // This prevents the need for Firestore composite indexes
  useEffect(()=>{
    if(authState!=='signed-in')return;
    const u1=db.collection('sessions').onSnapshot(s=>setAllSessions(s.docs.map(d=>({id:d.id,...d.data()}))));
    const u2=db.collection('songs').onSnapshot(s=>{const songs=s.docs.map(d=>({id:d.id,...d.data()}));songs.sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));setAllSongs(songs);});
    const u3=db.collection('users').onSnapshot(s=>setMembers(s.docs.map(d=>({id:d.id,...d.data()}))));
    const u4=db.collection('settings').doc('main').onSnapshot(d=>{if(d.exists&&d.data().bandName)setBandName(d.data().bandName);});
    const u5=db.collection('users').doc(authState==='signed-in'&&user?.uid||'x').onSnapshot(d=>{if(d.exists)setProfile({id:d.id,...d.data()});});
    return()=>{u1();u2();u3();u4();u5();};
  },[authState,user]);

  if(authState==='checking')return <div style={{display:'flex',height:'100vh',alignItems:'center',justifyContent:'center'}}><div className="spin"/></div>;
  if(authState==='no-config')return <div style={{display:'flex',height:'100vh',alignItems:'center',justifyContent:'center',padding:24,flexDirection:'column',gap:14,textAlign:'center'}}><div style={{fontSize:36}}>⚙️</div><div style={{fontSize:16,fontWeight:700}}>Firebase-Konfiguration fehlt</div><div style={{fontSize:13,color:'var(--t2)',maxWidth:300,lineHeight:1.6}}>Öffne die HTML-Datei und füge deine Firebase-Konfiguration in den Bereich <code style={{color:'var(--purple)'}}>FIREBASE_CONFIG</code> ein.</div></div>;
  if(authState==='signed-out')return <AuthScreen/>;
  if(!profile)return <div style={{display:'flex',height:'100vh',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:10,color:'var(--t2)'}}><div className="spin"/><div style={{fontSize:12}}>Profil wird geladen...</div></div>;

  return <div style={{height:'100vh',display:'flex',flexDirection:'column'}}>
    <div style={{flex:1,overflowY:'auto'}}>
      {tab==='dashboard'&&<DashboardPage user={user} profile={profile} allSessions={allSessions} allSongs={allSongs} members={members} bandName={bandName}/>}
      {tab==='schedule' &&<SchedulePage  user={user} profile={profile} allSessions={allSessions} allSongs={allSongs} members={members}/>}
      {tab==='songs'    &&<SongsPage     user={user} profile={profile} allSongs={allSongs} members={members}/>}
      {tab==='suggest'  &&<SuggestPage   user={user} profile={profile} allSongs={allSongs}/>}
      {tab==='profile'  &&<ProfilePage   user={user} profile={profile} setProfile={setProfile} design={design} onDesignUpdate={handleDesignUpdate} bandName={bandName} setBandName={setBandName}/>}
    </div>
    <BottomNav tab={tab} setTab={setTab}/>
  </div>;
}

applyDesign(loadDesign());
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
