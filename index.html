<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8"/>
  <!-- maximum-scale ist bewusst raus: Zoom darf der Nutzer nicht verboten werden. -->
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="color-scheme" content="dark"/>
  <meta name="theme-color" content="#121114"/>
  <title>BandSync</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Archivo = Display, IBM Plex Sans = Text, IBM Plex Mono = Zahlen/Akkorde -->
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<!--
  ═══════════════════════════════════════════════════════════════════
   APP-DATEIEN — die Reihenfolge ist wichtig!
   Alle Dateien teilen sich denselben globalen Scope (kein Bundler),
   jede Datei muss vor ihrer ersten Verwendung stehen, js/app.js zuletzt.
   Neue Datei: unten in APP_FILES eintragen.

   ⚠ APP_V BEI JEDEM DEPLOY HOCHZAEHLEN.
   GitHub Pages liefert alles mit `Cache-Control: max-age=600`. Ohne den
   ?v=-Parameter holt der Browser nach einem Push zwar die neue
   index.html, aber die alten .js/.css unter denselben Namen — die
   Mischung sieht dann so aus, als haette sich nichts geaendert.
  ═══════════════════════════════════════════════════════════════════
-->
<script>
  const APP_V = 2;
  const APP_FILES = [
    // 1. Kern / Grundlagen
    'js/core/react-hooks.js',
    'js/core/firebase-config.js',
    'js/core/theme.js',
    'js/core/constants.js',
    'js/core/helpers.js',
    'js/core/chords.js',
    'js/core/firebase.js',
    // 2. Wiederverwendbare Komponenten
    'js/components/icons.js',
    'js/components/ui.js',
    'js/components/chordchart.js',
    'js/components/sheet.js',
    'js/components/comments.js',
    'js/components/attendance.js',
    'js/components/hero.js',
    'js/components/nav.js',
    // 3. Seiten
    'js/pages/auth.js',
    'js/pages/dashboard.js',
    'js/pages/schedule.js',
    'js/pages/songs.js',
    'js/pages/songdetail.js',
    'js/pages/performance.js',
    'js/pages/profile.js',
    // 4. App-Einstieg (muss zuletzt kommen)
    'js/app.js',
  ];
  document.write('<link rel="stylesheet" href="css/styles.css?v=' + APP_V + '">');
</script>
</head>
<body>
<div id="root"><div style="display:flex;height:100vh;align-items:center;justify-content:center"><div class="spin"></div></div></div>

<!-- ═══ Bibliotheken (CDN) ═══ -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.28.4/babel.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>

<!-- ═══ Tailwind CSS (Play-CDN, kein Build-Schritt noetig) ═══ -->
<script src="https://cdn.tailwindcss.com"></script>
<script>document.write('<script src="js/core/tailwind-config.js?v=' + APP_V + '"><\/script>');</script>

<!--
  Die Tags werden geschrieben, waehrend der Parser laeuft — dadurch bleibt
  die Reihenfolge erhalten und Babel-Standalone findet sie beim Start.
-->
<script>
  APP_FILES.forEach(function(p){
    document.write('<script type="text/babel" src="' + p + '?v=' + APP_V + '"><\/script>');
  });
</script>
</body>
</html>
